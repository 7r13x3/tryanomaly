[data]
dataset      = "nsl-kdd"
path         = "data/"
test_size    = 0.2
random_state = 42
download     = true

[preprocess]
scaler             = "standard"
encode_categorical = "onehot"
drop_duplicates    = true
handle_missing     = "drop"

[isolation_forest]
n_estimators  = 100
contamination = 0.1
random_state  = 42
n_jobs        = -1

[oneclass_svm]
kernel = "rbf"
nu     = 0.1
gamma  = "scale"

[autoencoder]
hidden_dims   = [32, 16, 8]
epochs        = 50
batch_size    = 256
learning_rate = 0.001
threshold_pct = 95
